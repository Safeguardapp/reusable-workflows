version: 2
updates:
    - package-ecosystem: 'github-actions'
      directory: '/'
      schedule:
          interval: 'weekly'
          day: 'saturday'
      cooldown:
          default-days: 7
      open-pull-requests-limit: 10
      commit-message:
          prefix: '[Dependency] '
      groups:
          github-actions:
              patterns:
                  - '*'
