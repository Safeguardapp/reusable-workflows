name: Codestyle

on:
  workflow_call:
    inputs:
      workspace:
        required: false
        type: string
    secrets:
      # Unused. Stays declared until no caller passes it anymore (SG-11228).
      gh_package_registry_token:
        required: false

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Callers that declare their Node version in .nvmrc get that version. The
      # ones without the file stay on 18.x until they add it.
      - name: Resolve the Node version
        id: node_version
        run: |
          if [ -f .nvmrc ]; then
            echo "version=$(tr -d '[:space:]' < .nvmrc)" >> "$GITHUB_OUTPUT"
          else
            echo "version=18.x" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node_version.outputs.version }}
          cache: 'npm'

      - name: Setup NPM
        run: npm ci --force

      - name: Run lint
        if: "${{ inputs.workspace == '' }}"
        run: npm run lint

      - name: Run lint in workspace ${{ inputs.workspace }}
        if: "${{ inputs.workspace != '' }}"
        env:
          WORKSPACE: ${{ inputs.workspace }}
        run: npm run lint -w "$WORKSPACE"

      # Typechecks wherever the caller's build runs tsc -b, which follows the
      # project references that tsc --noEmit per folder misses (SG-10371).
      - name: Typecheck
        if: "${{ inputs.workspace == '' }}"
        run: npm run build --if-present

      - name: Typecheck workspace ${{ inputs.workspace }}
        if: "${{ inputs.workspace != '' }}"
        env:
          WORKSPACE: ${{ inputs.workspace }}
        run: npm run build -w "$WORKSPACE" --if-present
  prettier:
    name: Prettier
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Callers that declare their Node version in .nvmrc get that version. The
      # ones without the file stay on 18.x until they add it.
      - name: Resolve the Node version
        id: node_version
        run: |
          if [ -f .nvmrc ]; then
            echo "version=$(tr -d '[:space:]' < .nvmrc)" >> "$GITHUB_OUTPUT"
          else
            echo "version=18.x" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node_version.outputs.version }}
          cache: 'npm'

      - name: Setup NPM
        run: npm ci --force

      - name: Run prettier
        if: "${{ inputs.workspace == '' }}"
        run: npm run prettier:check

      - name: Run prettier in workspace ${{ inputs.workspace }}
        if: "${{ inputs.workspace != '' }}"
        run: npm run prettier:check -w ${{ inputs.workspace }}
