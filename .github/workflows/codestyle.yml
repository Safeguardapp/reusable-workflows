name: Codestyle

on:
  workflow_call:
    inputs:
      workspace:
        required: false
        type: string
    secrets:
      gh_package_registry_token:
        required: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_AUTH_TOKEN: ${{ secrets.gh_package_registry_token }}
    steps:
      - uses: actions/checkout@v3

      # Callers that declare their Node version in .nvmrc get that version. The
      # ones without the file stay on 18.x until they add it.
      - name: Resolve the Node version
        id: node_version
        run: |
          if [ -f .nvmrc ]; then
            echo "version=$(tr -d '[:space:]' < .nvmrc)" >> "$GITHUB_OUTPUT"
          else
            echo "version=18.x" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v3
        with:
          node-version: ${{ steps.node_version.outputs.version }}
          registry-url: "https://npm.pkg.github.com/"
          scope: "@safeguardapp"
          cache: 'npm'

      - name: Setup NPM
        run: npm ci --force

      - name: Run lint
        if: "${{ inputs.workspace == '' }}"
        run: npm run lint

      - name: Run lint in workspace ${{ inputs.workspace }}
        if: "${{ inputs.workspace != '' }}"
        run: npm run lint -w ${{ inputs.workspace }}
  prettier:
    name: Prettier
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_AUTH_TOKEN: ${{ secrets.gh_package_registry_token }}
    steps:
      - uses: actions/checkout@v3

      # Callers that declare their Node version in .nvmrc get that version. The
      # ones without the file stay on 18.x until they add it.
      - name: Resolve the Node version
        id: node_version
        run: |
          if [ -f .nvmrc ]; then
            echo "version=$(tr -d '[:space:]' < .nvmrc)" >> "$GITHUB_OUTPUT"
          else
            echo "version=18.x" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v3
        with:
          node-version: ${{ steps.node_version.outputs.version }}
          registry-url: "https://npm.pkg.github.com/"
          scope: "@safeguardapp"
          cache: 'npm'

      - name: Setup NPM
        run: npm ci --force

      - name: Run prettier
        if: "${{ inputs.workspace == '' }}"
        run: npm run prettier:check

      - name: Run prettier in workspace ${{ inputs.workspace }}
        if: "${{ inputs.workspace != '' }}"
        run: npm run prettier:check -w ${{ inputs.workspace }}
