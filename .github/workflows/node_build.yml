name: Test node application build

on:
  workflow_call:
    secrets:
      gh_package_registry_token:
        required: true

jobs:
  node_build:
    name: Test node application build
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.gh_package_registry_token }}

    steps:
      - uses: actions/checkout@v3

      # Callers that declare their Node version in .nvmrc get that version. The
      # ones without the file stay on 18.x until they add it.
      - name: Resolve the Node version
        id: node_version
        run: |
          if [ -f .nvmrc ]; then
            echo "version=$(tr -d '[:space:]' < .nvmrc)" >> "$GITHUB_OUTPUT"
          else
            echo "version=18.x" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v3
        with:
          node-version: ${{ steps.node_version.outputs.version }}
          registry-url: "https://npm.pkg.github.com/"
          scope: "@safeguardapp"

      - name: Install node packages
        run: npm ci --force

      - name: Run build command
        run: npm run build
