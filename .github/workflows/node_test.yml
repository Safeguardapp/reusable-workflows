name: Run node application tests

on:
  workflow_call:
    inputs:
      workspace:
        required: false
        type: string
    secrets:
      gh_package_registry_token:
        required: true

jobs:
  node_test:
    name: Run node application tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_AUTH_TOKEN: ${{ secrets.gh_package_registry_token }}

    services:
        postgres:
            image: postgis/postgis:16-3.4-alpine
            env:
                POSTGRES_USER: postgres
                POSTGRES_PASSWORD: postgres
                POSTGRES_DB: safeguard-test-api
            ports:
                - 5432:5432
            options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Callers that declare their Node version in .nvmrc get that version. The
      # ones without the file stay on 18.x until they add it.
      - name: Resolve the Node version
        id: node_version
        run: |
          if [ -f .nvmrc ]; then
            echo "version=$(tr -d '[:space:]' < .nvmrc)" >> "$GITHUB_OUTPUT"
          else
            echo "version=18.x" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.node_version.outputs.version }}
          registry-url: "https://npm.pkg.github.com/"
          scope: "@safeguardapp"

      - name: Create api schema
        run: psql postgresql://postgres:postgres@localhost:5432/safeguard-test-api -c "CREATE SCHEMA IF NOT EXISTS api;"

      - name: Install node packages
        run: npm ci --force

      - name: Run test command
        if: "${{ inputs.workspace == '' }}"
        run: npm run test

      - name: Run test command in workspace ${{ inputs.workspace }}
        if: "${{ inputs.workspace != '' }}"
        run: npm run test -w ${{ inputs.workspace }}
