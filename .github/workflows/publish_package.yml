name: Publish package

on:
  workflow_call:
    inputs:
      branch_name:
        required: false
        type: string
        default: 'main'
      version_increment_type:
        required: false
        type: string
        default: 'minor'
    secrets:
      gh_package_registry_token:
        required: true

jobs:
  Publish:
    name: Publish new ${{ github.event.inputs.version_increment_type }} version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_AUTH_TOKEN: ${{ secrets.gh_package_registry_token }}
    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.event.inputs.branch_name }}

      # Callers that declare their Node version in .nvmrc get that version. The
      # ones without the file stay on 18.x until they add it.
      - name: Resolve the Node version
        id: node_version
        run: |
          if [ -f .nvmrc ]; then
            echo "version=$(tr -d '[:space:]' < .nvmrc)" >> "$GITHUB_OUTPUT"
          else
            echo "version=18.x" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v3
        with:
          node-version: ${{ steps.node_version.outputs.version }}
          registry-url: "https://npm.pkg.github.com/"
          scope: "@safeguardapp"

      - name: Install packages
        run: npm ci

      - name: npm publish
        run: |
          git config --global user.name 'SafeguardApp'
          git config --global user.email 'info@safeguardapp.nl'

          if [ "${{ github.event.inputs.version_increment_type }}" != "patch" ] && \
            [ "${{ github.event.inputs.version_increment_type }}" != "minor" ] && \
            [ "${{ github.event.inputs.version_increment_type }}" != "major" ]; then
            echo "Invalid version increment type"
            exit 1
          fi

          npm version ${{ github.event.inputs.version_increment_type }} -m "[Release] %s"
          npm run publish:package
          git push --follow-tags
